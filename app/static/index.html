<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineScore MLOps v2 — Predictor de Rating</title>
  <style>
    :root {
      --bg: #070b14; --card: rgba(19, 28, 49, 0.92); --card-2: #0b1120; --text: #f8fafc;
      --muted: #94a3b8; --accent: #38bdf8; --accent-hover: #0284c7;
      --success: #22c55e; --warn: #f59e0b; --border: #263554;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(245, 158, 11, 0.10) 0%, transparent 40%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 96px
        ),
        linear-gradient(180deg, #0c1426 0%, var(--bg) 100%);
      color: var(--text); min-height: 100vh; padding: 28px 16px;
    }
    .app { max-width: 820px; margin: 0 auto; }
    .panel {
      background: var(--card); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; box-shadow: 0 24px 50px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent);
      background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #e2e8f0; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-2); color: var(--text); font-size: 14px;
    }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-primary {
      width: 100%; padding: 12px 16px; border: none; border-radius: 10px;
      background: var(--accent); color: #082f49; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    #resultado { margin-top: 22px; display: none; }
    .summary-box {
      background: var(--card-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 18px;
    }
    .rating-num { font-size: 28px; font-weight: 800; margin-top: 4px; }
    .good { color: var(--success); } .low { color: var(--warn); }
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 12px; }
    .movie-card {
      background: var(--card-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
    }
    .movie-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .movie-meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .movie-rating { font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <span class="badge">MLOps v2 · Umbral &gt; 7.0</span>
      <h1>Predictor de Rating de Películas</h1>
      <p class="sub">Estima un rating aproximado según año, género y director, y consulta películas similares.</p>
      <form id="movieForm">
        <div class="grid-3">
          <div>
            <label for="release_year">Año de estreno</label>
            <input type="number" id="release_year" value="2023" min="1900" max="2026" required />
          </div>
          <div>
            <label for="genre">Género</label>
            <select id="genre"><option value="drama">Drama</option></select>
          </div>
          <div>
            <label for="director">Director (opcional)</label>
            <input type="text" id="director" placeholder="Ej. Nolan, Spielberg..." />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary">Calcular Rating y Películas Similares</button>
        </div>
      </form>
      <div id="resultado"></div>
    </div>
  </div>
  <script>
    async function loadGenres() {
      try {
        const res = await fetch("/genres");
        const data = await res.json();
        if (Array.isArray(data.genres) && data.genres.length > 0) {
          document.getElementById("genre").innerHTML = data.genres
            .map(g => `<option value="${g}">${g.charAt(0).toUpperCase() + g.slice(1)}</option>`).join("");
        }
      } catch (_) {}
    }
    function renderCards(movies) {
      if (!movies || !movies.length) return `<p style="color:#94a3b8;font-size:13px;">Sin películas similares encontradas.</p>`;
      return `<div class="movies-grid">` + movies.map(m =>
        `<div class="movie-card">
          <div class="movie-title">${m.title}</div>
          <div class="movie-meta">${m.release_year} · ${m.genre}<br/>Dir: ${m.director}</div>
          <div class="movie-rating"><strong>Rating:</strong> ⭐ ${m.imdb_rating}</div>
        </div>`
      ).join("") + `</div>`;
    }
    document.getElementById("movieForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        release_year: Number(document.getElementById("release_year").value),
        genre: document.getElementById("genre").value,
        director: document.getElementById("director").value.trim(),
        imdb_rating_count: 1000
      };
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const good = data.estimated_rating > 7.0;
      const box = document.getElementById("resultado");
      box.style.display = "block";
      box.innerHTML = `
        <div class="summary-box">
          <div style="font-size:13px;color:#94a3b8;">Rating aproximado estimado</div>
          <div class="rating-num ${good ? "good" : "low"}">⭐ ${data.estimated_rating}</div>
          <div style="font-size:13px;color:#cbd5e1;margin-top:4px;">
            ${data.prediction_label} · Probabilidad (&gt; 7.0): <strong>${(data.high_rating_probability * 100).toFixed(2)}%</strong>
          </div>
        </div>
        <h3 style="margin:0 0 12px;font-size:16px;">Películas similares</h3>
        ${renderCards(data.similar_movies)}
      `;
    });
    loadGenres();
  </script>
</body>
</html>
