stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - models/champion_model.joblib
      - models/metrics_summary.json

  monitor:
    cmd: python monitoring/drift_check.py
    deps:
      - monitoring/drift_check.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - monitoring/drift_report.json
